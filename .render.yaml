applyTemplates: true

services:
  - type: web
    name: farmevidence-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false

  - type: web
    name: farmevidence-charts
    runtime: python
    plan: free
    rootDir: python-service
    buildCommand: bash ./build-wrapper.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

  - type: static
    name: farmevidence-client
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: REACT_APP_API_BASE_URL
        sync: false
